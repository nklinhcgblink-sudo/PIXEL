<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIXEL — PIXEL COLORFUL</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#080b14;--panel:#111827;--line:#ffffff18;--muted:#a7b0c2;--text:#f7f8fc;--blue:#60a5fa;--violet:#a78bfa;--gold:#fbbf24;--cyan:#7dd3fc}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;padding:clamp(16px,3vw,34px);background:radial-gradient(ellipse at 15% 8%,#5b3aa52c,transparent 35%),radial-gradient(ellipse at 88% 85%,#176da82c,transparent 35%),var(--bg);color:var(--text);font:14px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#ttl{width:min(1120px,100%);margin:0 auto 22px;display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#ffffff0b,#ffffff03);font-size:clamp(19px,2.7vw,25px);font-weight:950;letter-spacing:-.7px;box-shadow:0 18px 55px #0002}
#ttl:before{content:"P";display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#fbbf24,#8b5cf6 60%,#60a5fa);color:#0a0c14;font-size:20px;font-weight:1000;box-shadow:0 12px 36px #8b5cf633}
#app{width:min(1120px,100%);margin:0 auto;min-width:0}
#app>p.mut{padding:22px;border:1px dashed var(--line);border-radius:16px;background:#ffffff05;color:var(--muted)}
.mut{color:var(--muted)}
button,input{font:inherit;padding:11px 15px;border-radius:12px;border:1px solid #ffffff20;background:#ffffff08;color:var(--text);outline:none;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
button{cursor:pointer;font-weight:800;box-shadow:inset 0 1px #ffffff08}
button:hover{transform:translateY(-2px);border-color:#a5b4fc88;background:#ffffff12;box-shadow:0 10px 28px #0003}
button:focus-visible,input:focus-visible{outline:3px solid #a5b4fc;outline-offset:3px}
button.p{color:#0a0c14;border-color:transparent;background:linear-gradient(110deg,#fbbf24,#c4b5fd 56%,#7dd3fc);box-shadow:0 8px 28px #8b5cf626}
button.p:hover{background:linear-gradient(110deg,#fcd34d,#ddd6fe 56%,#bae6fd);box-shadow:0 12px 32px #8b5cf633}
button.d{background:#7f1d1d30;color:#fecaca;border-color:#f8717145}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#ffffff0b,#ffffff04);backdrop-filter:blur(14px);box-shadow:0 12px 36px #0002}
.bar .mut{font-size:13px}
input{min-width:0;max-width:100%}
input::placeholder{color:#7f8ba2}
.pal{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0b0e1beF;padding:13px 15px;box-shadow:0 12px 32px #0004;backdrop-filter:blur(18px)}
.sw{width:38px;height:38px;padding:0;border-radius:50%;border:3px solid #ffffff25;box-shadow:0 3px 12px #0004;transition:transform .18s,box-shadow .18s,border-color .18s}
.sw:hover{transform:translateY(-2px) scale(1.06)}
.sw.sel{border-color:#fff;transform:scale(1.1);box-shadow:0 0 0 3px #a78bfa,0 0 22px #8b5cf677}
.big{display:block;width:100%;max-width:760px;margin:20px auto;border:1px solid #ffffff40;border-radius:20px;background:#fff;touch-action:manipulation;cursor:pointer;box-shadow:0 22px 70px #0006,0 0 0 6px #ffffff04;overflow:hidden}
.big.off{cursor:not-allowed;opacity:.86}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:16px;margin-top:16px}
.card{min-width:0;position:relative;background:linear-gradient(145deg,#ffffff0c,#ffffff04);border:1px solid var(--line);border-radius:22px;padding:15px;cursor:pointer;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;box-shadow:0 14px 38px #0002;overflow:hidden}
.card:hover{border-color:#a5b4fc80;transform:translateY(-4px);background:linear-gradient(145deg,#ffffff12,#ffffff06);box-shadow:0 20px 45px #0004}
.card canvas{width:100%;display:block;border:1px solid #ffffff20;border-radius:12px;margin-top:12px;background:#fff}
.card b{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;color:#ddd6fe;background:#a78bfa18;border:1px solid #a78bfa40}
.welcome{max-width:860px;margin:clamp(28px,7vh,70px) auto 24px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#a5b4fc;font-size:11px;font-weight:900;letter-spacing:3px}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:#7dd3fc;box-shadow:0 0 14px #7dd3fc}
.welcome h2{font-size:clamp(34px,6vw,62px);letter-spacing:-2.6px;line-height:1.05;margin:16px 0}
.welcome h2 span{background:linear-gradient(90deg,#fbbf24,#c4b5fd 52%,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{max-width:620px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.85}
.entry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:28px 0}
.entry-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:240px;padding:24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#ffffff0b,#ffffff03);overflow:hidden;transition:transform .2s,border-color .2s,background .2s}
.entry-card:after{content:"";position:absolute;width:190px;height:190px;right:-65px;top:-75px;border-radius:50%;background:#8b5cf6;opacity:.15;filter:blur(1px);pointer-events:none}
.entry-card.join:after{background:#60a5fa}
.entry-card:hover{transform:translateY(-4px);border-color:#ffffff48;background:linear-gradient(145deg,#ffffff12,#ffffff05)}
.entry-icon{display:grid;place-items:center;width:54px;height:54px;border:1px solid #ffffff20;border-radius:17px;background:#ffffff0b;color:#c4b5fd;font-size:24px;margin-bottom:22px}
.join .entry-icon{color:#93c5fd}
.entry-card h3{font-size:24px;letter-spacing:-.6px;margin:0 0 7px}
.entry-card p{margin:0 0 20px;color:var(--muted);line-height:1.7}
.entry-card button{margin-top:auto;position:relative;z-index:1}
.entry-card input{width:100%;margin:0 0 10px;position:relative;z-index:1}
.footnote{text-align:center;color:#657087;font-size:11px;padding:12px 0 24px}
@media(max-width:640px){body{padding:12px}#ttl{padding:11px 12px;margin-bottom:14px;font-size:19px;border-radius:15px}#ttl:before{flex-basis:36px;height:36px}.bar{padding:11px;gap:8px;border-radius:15px}.bar button{flex:0 0 auto}.pal{padding:10px;gap:9px}.sw{width:34px;height:34px}.big{margin:14px auto;border-radius:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,155px),1fr));gap:10px}.card{padding:10px;border-radius:17px}.welcome{margin:30px auto 20px}.welcome h2{letter-spacing:-1.4px}.welcome p{font-size:14px}.entry-grid{grid-template-columns:1fr;gap:12px;margin:22px 0}.entry-card{min-height:210px;padding:20px;border-radius:20px}.entry-card h3{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

/* Cinematic intro screen */
#pixel-intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;padding:24px;background:radial-gradient(ellipse at 18% 20%,#6d28d933,transparent 38%),radial-gradient(ellipse at 82% 78%,#0284c733,transparent 38%),#070810;transition:opacity .65s ease,visibility .65s ease}
#pixel-intro::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
#pixel-intro::after{content:"";position:absolute;width:min(64vw,620px);aspect-ratio:1;border:1px solid #a78bfa25;border-radius:50%;box-shadow:0 0 0 44px #8b5cf60b,0 0 0 100px #60a5fa08;pointer-events:none;animation:intro-pulse 7s ease-in-out infinite}
#pixel-intro.hidden{opacity:0;visibility:hidden;pointer-events:none}
.intro-inner{position:relative;z-index:1;width:min(800px,100%);text-align:center;animation:intro-rise .9s cubic-bezier(.2,.8,.2,1) both}
.intro-brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:clamp(34px,7vh,70px);font-weight:950;letter-spacing:.22em;font-size:13px;color:#dbeafe}
.intro-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#c4b5fd,#60a5fa);color:#080b14;font-size:20px;letter-spacing:-.08em;box-shadow:0 0 34px #8b5cf655}
.intro-status{display:flex;align-items:center;justify-content:center;gap:9px;color:#a5b4fc;font-size:11px;font-weight:850;letter-spacing:.24em;text-transform:uppercase}
.intro-dot{width:7px;height:7px;border-radius:50%;background:#67e8f9;box-shadow:0 0 16px #67e8f9;animation:intro-blink 1.5s ease-in-out infinite}
.intro-title{margin:22px 0 18px;font-size:clamp(42px,8.5vw,88px);line-height:.99;letter-spacing:-.075em;font-weight:1000}
.intro-title span{display:block;color:transparent;background:linear-gradient(100deg,#fff 8%,#c4b5fd 45%,#7dd3fc 90%);background-clip:text;-webkit-background-clip:text}
.intro-copy{max-width:520px;margin:0 auto;color:#aab3c8;font-size:clamp(14px,2vw,17px);line-height:1.8}
.intro-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:34px}
.intro-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:0 25px;border:1px solid #ffffff20;border-radius:14px;color:#f8fafc;background:#ffffff08;font:inherit;font-weight:900;letter-spacing:.04em;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.intro-btn.primary{border-color:#a78bfa66;background:linear-gradient(110deg,#7c3aed,#2563eb);box-shadow:0 12px 40px #4f46e555}
.intro-btn:hover{transform:translateY(-3px);border-color:#c4b5fd;box-shadow:0 16px 45px #4f46e544}
.intro-hint{margin-top:24px;color:#667085;font-size:10px;font-weight:800;letter-spacing:.2em}
.intro-loader{width:118px;height:2px;margin:24px auto 0;overflow:hidden;background:#ffffff12;border-radius:99px}
.intro-loader::after{content:"";display:block;width:42%;height:100%;background:linear-gradient(90deg,#8b5cf6,#67e8f9);box-shadow:0 0 12px #8b5cf6;animation:intro-load 2s ease-in-out infinite}
@keyframes intro-rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes intro-pulse{50%{transform:scale(1.06);opacity:.65}}
@keyframes intro-blink{50%{opacity:.35;transform:scale(.75)}}
@keyframes intro-load{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
@media(max-width:560px){#pixel-intro{padding:22px}.intro-brand{margin-bottom:42px}.intro-title{letter-spacing:-.065em}.intro-actions{flex-direction:column;align-items:stretch;max-width:320px;margin:30px auto 0}.intro-btn{width:100%}}
@media(prefers-reduced-motion:reduce){#pixel-intro,.intro-inner,.intro-dot,.intro-loader::after{animation:none!important;transition:none!important}}


/* PIXEL front-end deterrents: these do not replace server-side security. */
#pixel-security-warning{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,#35205f 0%,#111426 45%,#05060b 100%);color:#f8fafc;text-align:center;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
#pixel-security-warning.active{display:flex}
#pixel-security-warning .security-card{width:min(560px,100%);padding:clamp(26px,5vw,48px);border:1px solid #a78bfa55;border-radius:28px;background:#111827eF;box-shadow:0 30px 100px #0009,0 0 80px #8b5cf622;backdrop-filter:blur(18px)}
#pixel-security-warning .security-mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 22px;border-radius:20px;background:linear-gradient(135deg,#fbbf24,#a78bfa 60%,#60a5fa);color:#090b13;font-size:30px;font-weight:1000}
#pixel-security-warning h2{margin:0 0 12px;font-size:clamp(25px,5vw,38px);letter-spacing:-1px}
#pixel-security-warning p{margin:0 auto 22px;max-width:420px;color:#c5ccdc;line-height:1.8}
#pixel-security-warning button{color:#0a0c14;border:0;background:linear-gradient(110deg,#fbbf24,#c4b5fd 56%,#7dd3fc);padding:13px 22px;border-radius:13px;font-weight:900;cursor:pointer}
@media(prefers-reduced-motion:no-preference){#pixel-security-warning.active .security-card{animation:pixelSecurityIn .22s ease-out}@keyframes pixelSecurityIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}}


/* Admin password gate */
#pixel-admin-login{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:20px;background:#05060beF;backdrop-filter:blur(18px)}
#pixel-admin-login[hidden]{display:none}
#pixel-admin-login .admin-box{width:min(440px,100%);padding:28px;border:1px solid #a78bfa55;border-radius:24px;background:linear-gradient(145deg,#17152a,#0d1220);box-shadow:0 28px 100px #0009}
#pixel-admin-login .admin-kicker{color:#c4b5fd;font-size:11px;font-weight:900;letter-spacing:2px}
#pixel-admin-login h2{margin:10px 0;font-size:28px;letter-spacing:-.8px}
#pixel-admin-login p{color:var(--muted);line-height:1.7}
#pixel-admin-login form{display:grid;gap:12px}
#pixel-admin-login input{width:100%;min-height:48px}
#pixel-admin-login .admin-actions{display:flex;gap:10px;flex-wrap:wrap}
#pixel-admin-login .admin-error{min-height:22px;color:#fca5a5;font-size:13px}


/* PIXEL Admin Studio — ROFLIX-inspired admin layout, adapted for the live game */
.pixel-admin-shell{width:min(1400px,100%);margin:0 auto;display:grid;grid-template-columns:228px minmax(0,1fr);min-height:560px;border:1px solid #ffffff16;border-radius:22px;overflow:hidden;background:#0b0f1b;box-shadow:0 28px 90px #0005}
.pixel-admin-sidebar{display:flex;flex-direction:column;gap:22px;padding:20px 14px;background:linear-gradient(180deg,#111526,#0c101c);border-right:1px solid #ffffff12}
.pixel-admin-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid #ffffff12;font-size:16px;font-weight:950;letter-spacing:-.4px}
.pixel-admin-brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#c4b5fd,#60a5fa);color:#080b14;font-weight:1000}
.pixel-admin-brand small{display:block;color:#8d9ab2;font-size:9px;letter-spacing:1.8px;font-weight:800;margin-top:2px}
.pixel-admin-nav{display:grid;gap:6px}
.pixel-admin-nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:11px;background:transparent;color:#9ca8be;text-align:left;box-shadow:none;font-size:13px;font-weight:750}
.pixel-admin-nav button:hover,.pixel-admin-nav button.active{transform:none;background:linear-gradient(100deg,#8b5cf622,#60a5fa0c);border-color:#a78bfa35;color:#f4f3ff;box-shadow:none}
.pixel-admin-nav button span{width:22px;text-align:center;font-size:16px}
.pixel-admin-sidefoot{margin-top:auto;padding:12px 8px 0;border-top:1px solid #ffffff12;color:#66738b;font-size:10px;line-height:1.7}
.pixel-admin-main{min-width:0;padding:20px;background:radial-gradient(ellipse at 95% 0%,#4338ca12,transparent 35%),#0b0f1b}
.pixel-admin-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding:4px 2px 18px;border-bottom:1px solid #ffffff12}
.pixel-admin-topbar h2{margin:0;font-size:clamp(19px,2.5vw,26px);letter-spacing:-.8px}
.pixel-admin-topbar p{margin:4px 0 0;color:#8995ac;font-size:12px}
.pixel-admin-live{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #34d39935;border-radius:99px;background:#10b98112;color:#6ee7b7;font-size:10px;font-weight:900;letter-spacing:.8px}
.pixel-admin-live:before{content:"";width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399}
.pixel-admin-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 16px}
.pixel-admin-stat{min-width:0;padding:15px;border:1px solid #ffffff12;border-radius:15px;background:linear-gradient(145deg,#ffffff09,#ffffff03)}
.pixel-admin-stat span{display:block;color:#8f9bb1;font-size:11px;font-weight:700}
.pixel-admin-stat strong{display:block;margin-top:7px;font-size:27px;line-height:1.1;letter-spacing:-1px}
.pixel-admin-stat small{display:block;margin-top:7px;color:#78859c;font-size:10px}
.pixel-admin-content{min-width:0}
.pixel-admin-content .bar{margin-bottom:13px;background:#111727;border-color:#ffffff12}
.pixel-admin-content .card{border-radius:16px}
.pixel-admin-content .grid{margin-top:14px}
.pixel-admin-content .pixel-room-card{padding:18px;background:linear-gradient(145deg,#151b2b,#101522);border-color:#ffffff18}
.pixel-admin-content .pixel-room-card .room-code{display:inline-block;margin:8px 0 10px;padding:7px 13px;border:1px solid #a78bfa44;border-radius:11px;background:#8b5cf61a;color:#ddd6fe;font-size:25px;font-weight:950;letter-spacing:4px}
.pixel-admin-content .pixel-room-card .room-link{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#9ca8be;font-size:12px}
.pixel-admin-content .pixel-room-card .room-link span{min-width:0;overflow-wrap:anywhere;color:#cbd5e1}
.pixel-admin-content .mut{font-size:12px}
@media(max-width:850px){.pixel-admin-shell{grid-template-columns:1fr}.pixel-admin-sidebar{padding:12px;gap:10px;border-right:0;border-bottom:1px solid #ffffff12}.pixel-admin-brand{padding:2px 4px 10px}.pixel-admin-nav{display:flex;overflow:auto;padding-bottom:2px}.pixel-admin-nav button{width:auto;flex:0 0 auto;white-space:nowrap}.pixel-admin-sidefoot{display:none}.pixel-admin-main{padding:14px}}
@media(max-width:540px){.pixel-admin-shell{border-radius:16px}.pixel-admin-main{padding:10px}.pixel-admin-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.pixel-admin-stat{padding:11px 9px}.pixel-admin-stat strong{font-size:22px}.pixel-admin-stat span{font-size:10px}.pixel-admin-stat small{font-size:9px}.pixel-admin-topbar{align-items:flex-start}.pixel-admin-content .bar{padding:10px}.pixel-admin-nav button{padding:9px 10px;font-size:11px}}

</style></head><body>
<div id="pixel-intro" role="dialog" aria-label="Chào mừng đến PIXEL"><div class="intro-inner"><div class="intro-brand"><span class="intro-mark">P</span><span>PIXEL / COLOR STUDIO</span></div><div class="intro-status"><span class="intro-dot"></span> ONLINE MULTIPLAYER</div><h2 class="intro-title">Mỗi nét vẽ,<span>một cuộc vui.</span></h2><p class="intro-copy">Tụ họp bạn bè, chọn màu của riêng bạn và cùng nhau hoàn thành một thế giới đầy sắc màu.</p><div class="intro-actions"><button class="intro-btn primary" id="intro-enter">VÀO PIXEL <span aria-hidden="true">↗</span></button></div><div class="intro-loader" aria-hidden="true"></div><div class="intro-hint">CREATE · COLOR · CONNECT</div></div></div>
<h1 id="ttl">PIXEL COLORFUL</h1>
<div id="app" class="mut">Đang tải hình…</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

      const bar=document.createElement("div");bar.className="bar";
      bar.innerHTML='<span class="tag">'+(locked?"🔒 Đã khóa lượt tô":"● Đang đồng bộ")+'</span><span class="mut">Tô ở thiết bị nào, đồng đội sẽ thấy gần như ngay lập tức.</span><span class="tag" id="pixel-countdown">Chưa bắt đầu</span><span class="mut" id="team-live-count"></span>';
      app.appendChild(bar);if(!locked)app.appendChild(palette());
      const stat=document.createElement("div");stat.className="mut";stat.style.textAlign="center";stat.style.margin="4px";stat.textContent=mine.filter(v=>v>0).length+" vùng đã tô";app.appendChild(stat);
      app.appendChild(paintCanvas(mine,!locked,async(a,region,color)=>{
        mine=a.slice();stat.textContent=mine.filter(v=>v>0).length+" vùng đã tô · Đang lưu…";
        fillQueue.push({region,color});
        if(fillTimer)clearTimeout(fillTimer);
        fillTimer=setTimeout(flushFills,65);
      }));
      const submitBar=document.createElement("div");submitBar.className="bar";submitBar.style.justifyContent="center";submitBar.innerHTML='<button class="p" id="submit-answer" '+(!timerInfo.started_at||locked||submissionPending?"disabled":"")+'>Nộp đáp án</button><span class="mut" id="score-status"></span>';app.appendChild(submitBar);
      const scoreStatus=submitBar.querySelector("#score-status");if(submissionPending)scoreStatus.textContent="📨 Đã nộp bài thành công — đang chờ admin công bố kết quả.";else if(publishedSubmission)scoreStatus.textContent=(publishedSubmission.correct?"✅ Đáp án chính xác! ":"❌ Chưa chính xác. ")+"Điểm: "+publishedSubmission.score+"/100 · Thiếu "+publishedSubmission.missing_regions+" · Thừa "+publishedSubmission.extra_regions+" · Sai màu "+publishedSubmission.wrong_colors+". Kết quả đã được admin công bố.";
      submitBar.querySelector("#submit-answer").onclick=async()=>{if(!confirm("Nộp bài hiện tại để chấm điểm? Mỗi lượt sai bị trừ 15 điểm."))return;const btn=submitBar.querySelector("#submit-answer");btn.disabled=true;try{if(fillTimer){clearTimeout(fillTimer);fillTimer=null}while(fillQueue.length){const batch=fillQueue.splice(0,100);try{await request("fill",{fills:batch})}catch(e){fillQueue.unshift(...batch);throw e}}await request("submit");submissionPending=true;publishedSubmission=null;submitBar.querySelector("#score-status").textContent="📨 Đã nộp bài thành công — đang chờ admin công bố kết quả.";await sync(true);}catch(e){submitBar.querySelector("#score-status").textContent=e.message;alert(e.message)}finally{if(submitBar.querySelector("#submit-answer"))submitBar.querySelector("#submit-answer").disabled=!timerInfo.started_at||locked||submissionPending}};
      if(timerUiTimer)clearInterval(timerUiTimer);const updateCountdown=()=>{const el=app.querySelector("#pixel-countdown");if(!el)return;if(!timerInfo.started_at){el.textContent="Chưa bắt đầu";return}const left=Math.max(0,Math.ceil((new Date(timerInfo.started_at).getTime()+Number(timerInfo.duration_seconds||900)*1000-Date.now())/1000));el.textContent=left>0?"⏱ Còn "+Math.floor(left/60)+"p "+String(left%60).padStart(2,"0")+"s":"⏱ Hết giờ";};updateCountdown();timerUiTimer=setInterval(updateCountdown,1000);
      const members=document.createElement("div");members.className="bar";members.style.justifyContent="center";members.innerHTML='<span class="mut">Thành viên đang hoạt động: </span><strong id="members-list">Đang tải…</strong><span class="mut"> · Điểm: '+(((Number(teamStats.correct_submissions)||0)+(Number(teamStats.incorrect_submissions)||0))?(teamStats.score??100)+'/100':'Chưa nộp')+' · Đúng: '+(teamStats.correct_submissions||0)+' · Sai: '+(teamStats.incorrect_submissions||0)+'</span>';app.appendChild(members);
      request("state").then(d=>{const names=(d.members||[]).map(m=>m.name);const el=members.querySelector("#members-list");if(el)el.textContent=names.join(", ")||"Chỉ bạn";}).catch(()=>{});
    }
    if(!name){showJoin();return}
    (async()=>{try{await request("join");await sync(true);pollTimer=setInterval(()=>sync(false),5000);heartbeatTimer=setInterval(()=>request("heartbeat").catch(()=>{}),15000)}catch(e){showJoin(e.message)}})();
  }

})();
</script>
<script>
(function(){
  "use strict";
  const warning=document.createElement("div");
  warning.id="pixel-security-warning";
  warning.setAttribute("role","alertdialog");
  warning.setAttribute("aria-modal","true");
  warning.setAttribute("aria-labelledby","pixel-security-title");
  warning.innerHTML='<div class="security-card"><div class="security-mark">P</div><h2 id="pixel-security-title">Vui lòng không mở DevTools</h2><p>PIXEL khuyến khích người chơi sử dụng giao diện đúng mục đích. Các phím tắt dành cho công cụ nhà phát triển đã bị hạn chế trên trang này.</p><button type="button" id="pixel-security-return">QUAY LẠI PIXEL</button></div>';
  document.body.appendChild(warning);
  let priorFocus=null;
  function showWarning(){
    priorFocus=document.activeElement;
    warning.classList.add("active");
    document.documentElement.style.overflow="hidden";
    const button=document.getElementById("pixel-security-return");
    if(button)button.focus({preventScroll:true});
  }
  function hideWarning(){
    warning.classList.remove("active");
    document.documentElement.style.overflow="";
    if(priorFocus&&typeof priorFocus.focus==="function")priorFocus.focus({preventScroll:true});
  }
  document.getElementById("pixel-security-return").addEventListener("click",hideWarning);
  document.addEventListener("contextmenu",function(e){e.preventDefault();},true);
  document.addEventListener("keydown",function(e){
    const key=(e.key||"").toLowerCase();
    const devtoolsKey=key==="f12" || (e.ctrlKey&&e.shiftKey&&["i","j","c"].includes(key)) ||
      (e.metaKey&&e.altKey&&["i","j","c"].includes(key));
    const viewSource=e.ctrlKey&&key==="u";
    if(devtoolsKey||viewSource){
      e.preventDefault();
      e.stopPropagation();
      if(typeof e.stopImmediatePropagation==="function")e.stopImmediatePropagation();
      showWarning();
    }
    if(e.key==="Escape"&&warning.classList.contains("active")){
      e.preventDefault();
      e.stopPropagation();
    }
  },true);
})();
</script></body></html>
